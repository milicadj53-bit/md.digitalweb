<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radovi | MD Digital</title>
<meta name="description" content="Sajtovi koje je MD Digital napravio za lokalne biznise, po delatnostima: stomatologija, lepota i nega, kućne usluge.">
<meta name="robots" content="index, follow">
<meta name="theme-color" content="#1B160F">
<link rel="canonical" href="https://mddigitalweb.com/radovi">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="assets/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="assets/favicon-16.png" sizes="16x16" type="image/png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta property="og:type" content="website">
<meta property="og:site_name" content="MD Digital">
<meta property="og:locale" content="sr_RS">
<meta property="og:title" content="Radovi | MD Digital">
<meta property="og:description" content="Sajtovi koje je MD Digital napravio za lokalne biznise, po delatnostima: stomatologija, lepota i nega, kućne usluge.">
<meta property="og:url" content="https://mddigitalweb.com/radovi">
<meta property="og:image" content="https://mddigitalweb.com/assets/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="MD Digital, izrada sajtova za lokalne biznise">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Radovi | MD Digital">
<meta name="twitter:description" content="Sajtovi koje je MD Digital napravio za lokalne biznise, po delatnostima: stomatologija, lepota i nega, kućne usluge.">
<meta name="twitter:image" content="https://mddigitalweb.com/assets/og-image.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script>window.__mdSeo=1;window.__mdStaticHead=1;</script>
<style id="md-pre">html,body{background:#1B160F}html::after{content:"";position:fixed;inset:0;background:#1B160F;z-index:9997}</style>
<script>setTimeout(function(){var m=document.getElementById("md-pre");if(m)m.remove();},4000);</script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Hanken+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>window.MD_PAGE={title:"Radovi | MD Digital",desc:"Sajtovi koje je MD Digital napravio za lokalne biznise, po delatnostima: stomatologija, lepota i nega, kućne usluge.",path:"/radovi"};</script>
<script src="site.js"></script>
</helmet>
<div style="background:#F9F4ED; color:#211C14; font-family:'Hanken Grotesk',system-ui,sans-serif; font-size:17px; line-height:1.6; min-height:100vh;">
  <dc-import name="SiteHeader" active="radovi" hint-size="100%,76px" style="position:sticky; top:0; z-index:50; display:block;"></dc-import>
  <main>
    <section style="position:relative; overflow:hidden; padding:clamp(40px,8vw,110px) clamp(20px,5vw,64px) clamp(32px,4vw,56px);">
      <div aria-hidden="true" data-parallax="0.25" style="position:absolute; right:-3vw; bottom:-5vw; font-family:'Newsreader',serif; font-size:clamp(120px,24vw,360px); line-height:0.8; color:rgba(190,143,39,0.09); white-space:nowrap; pointer-events:none;">Radovi</div>
      <div style="position:relative; max-width:1240px; margin:0 auto;">
        <div data-reveal="up" style="font-family:'JetBrains Mono',monospace; font-size:12.5px; letter-spacing:0.22em; text-transform:uppercase; color:#BE8F27; margin-bottom:22px;">Radovi</div>
        <h1 data-stagger="80" style="font-family:'Newsreader',serif; font-weight:400; font-size:clamp(50px,8.5vw,120px); line-height:0.98; letter-spacing:-0.025em;">
          <span style="display:inline-block; overflow:hidden; vertical-align:top; padding:0 0.08em 0.1em 0; margin:0 -0.08em -0.1em 0;"><span data-reveal="word" style="display:inline-block;">Naši</span></span>
          <span style="display:inline-block; overflow:hidden; vertical-align:top; padding:0 0.12em 0.1em 0; margin:0 -0.12em -0.1em 0;"><span data-reveal="word" data-base="skewX(-8deg)" style="display:inline-block; color:#BE8F27; transform:skewX(-8deg);">radovi</span></span>
        </h1>
        <p data-reveal="up" data-delay="300" style="margin-top:28px; max-width:46ch; font-size:clamp(18px,1.7vw,21px); color:#4a4335; text-wrap:pretty;">Izaberite svoju delatnost i pogledajte sajtove koje smo napravili za slične biznise.</p>
      </div>
    </section>

    <div style="position:sticky; top:76px; z-index:20; background:rgba(249,244,237,0.92); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border-top:1px solid rgba(33,28,20,0.08); border-bottom:1px solid rgba(33,28,20,0.08);">
      <div role="tablist" aria-label="Delatnosti" style="max-width:1240px; margin:0 auto; padding:14px clamp(20px,5vw,64px); display:flex; gap:10px; overflow-x:auto; scrollbar-width:none;">
        <sc-for list="{{ chips }}" as="c" hint-placeholder-count="4">
          <button type="button" role="tab" aria-selected="{{ c.selected }}" onClick="{{ c.pick }}" style="{{ c.style }}">
            <span>{{ c.label }}</span>
            <span style="{{ c.countStyle }}">{{ c.count }}</span>
          </button>
        </sc-for>
      </div>
    </div>

    <section ref="{{ refList }}" style="max-width:1240px; margin:0 auto; padding:clamp(12px,2vw,24px) clamp(20px,5vw,64px) clamp(48px,10vw,130px);">
      <sc-if value="{{ nicheIntro }}" hint-placeholder-val="">
        <p style="padding:clamp(24px,3vw,36px) 0 4px; max-width:60ch; font-family:'Newsreader',serif; font-size:clamp(22px,2.4vw,30px); line-height:1.3; color:#211C14; text-wrap:pretty;">{{ nicheIntro }}</p>
      </sc-if>
      <sc-for list="{{ projects }}" as="p" hint-placeholder-count="3">
        <article class="md-col" style="{{ p.rowStyle }}">
          <div data-reveal="up" style="flex:1.4; min-width:0; width:100%;">
            <a href="{{ p.url }}" target="_blank" rel="noopener noreferrer" data-cursor="Pogledaj" aria-label="{{ p.aria }}" style="display:block;">
              <div data-tilt="1" style="border-radius:20px; overflow:hidden; background:#e6dcc8; box-shadow:0 40px 80px -50px rgba(33,28,20,0.6); transition:transform .5s cubic-bezier(.2,.7,.2,1);"><div style="aspect-ratio:16/10; overflow:hidden;"><img data-tilt-img="1" src="{{ p.img }}" alt="{{ p.alt }}" width="1600" height="1000" loading="lazy" decoding="async" style="width:100%; height:100%; object-fit:cover; object-position:top; display:block; transition:transform .6s cubic-bezier(.2,.7,.2,1);"></div></div>
            </a>
          </div>
          <div data-reveal="up" data-delay="150" style="flex:1; min-width:0;">
            <div style="font-family:'JetBrains Mono',monospace; font-size:12px; letter-spacing:0.14em; text-transform:uppercase; color:#8a8270;">{{ p.num }} / {{ p.cat }}</div>
            <h2 style="font-family:'Newsreader',serif; font-weight:400; font-size:clamp(38px,5vw,66px); line-height:1; letter-spacing:-0.02em; margin:14px 0 18px;">{{ p.name }}</h2>
            <p style="color:#4a4335; font-size:18px; text-wrap:pretty; max-width:40ch;">{{ p.desc }}</p>
            <div class="md-btns" style="display:flex; margin-top:28px;"><a data-magnetic="1" href="{{ p.url }}" target="_blank" rel="noopener noreferrer" style="display:inline-flex; align-items:center; gap:10px; padding:15px 26px; border:1px solid #211C14; color:#211C14; border-radius:999px; font-weight:500; transition:background .25s, color .25s;" style-hover="background:#211C14; color:#F9F4ED;">Pogledaj projekat <span aria-hidden="true">↗</span></a></div>
          </div>
        </article>
      </sc-for>
      <div style="display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:20px; margin-top:clamp(40px,5vw,64px); padding:clamp(28px,3.5vw,40px); background:#F2EBDD; border-radius:22px;">
        <p style="font-family:'Newsreader',serif; font-size:clamp(22px,2.4vw,30px); line-height:1.25; max-width:30ch; text-wrap:balance;">Vaša delatnost nije na listi? Pravimo sajtove za sve lokalne biznise.</p>
        <a data-magnetic="1" href="kontakt.html" style="display:inline-flex; align-items:center; gap:10px; padding:15px 26px; background:#211C14; color:#F9F4ED; border-radius:999px; font-weight:500; transition:background .25s;" style-hover="background:#BE8F27; color:#1B160F;">Pošalji upit <span aria-hidden="true">→</span></a>
      </div>
    </section>
  </main>
  <dc-import name="SiteFooter" hint-size="100%,820px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  NICHES = [
    { id: "sve", label: "Sve", intro: "" },
    { id: "zdravlje", label: "Stomatologija i zdravlje", intro: "Za ordinacije i klinike: jasno predstavljene usluge, prostor koji uliva poverenje i lako zakazivanje kontakta." },
    { id: "lepota", label: "Lepota i nega", intro: "Za salone, studije i brendove nege: atmosfera brenda, usluge i cene na jednom mestu i galerija koja prodaje." },
    { id: "usluge", label: "Kućne usluge", intro: "Za servise i firme na terenu: šta radite, koliko košta i kako da vas pozovu, odmah na prvom ekranu." },
  ];
  PROJECTS = [
    { niche: "zdravlje", name: "Dentilist", cat: "Stomatološka ordinacija", url: "https://milicadj53-bit.github.io/portfolio.dentilist/", img: "assets/project-dentilist.png", desc: "Radili smo dizajn i izradu sajta sa fokusom na usluge, prikaz ordinacije i jednostavan kontakt sa pacijentima." },
    { niche: "lepota", name: "Néra", cat: "Nega kože", url: "https://milicadj53-bit.github.io/Nera/", img: "assets/project-nera.png", desc: "Radili smo dizajn i izradu sajta za brend nege kože, sa fokusom na proizvode, sastojke i ritual nege." },
    { niche: "lepota", name: "Beauty Anabella", cat: "Beauty salon", url: "https://milicadj53-bit.github.io/beautyanabella/", img: "assets/project-anabella.png", desc: "Radili smo dizajn i izradu sajta za salon lepote, sa fokusom na usluge, cenovnik i galeriju." },
    { niche: "lepota", name: "My Beauty Studio", cat: "Beauty salon", url: "https://milicadj53-bit.github.io/portolio.mdbeauty/", img: "assets/project-mbeauty.png", desc: "Radili smo dizajn i izradu sajta za beauty studio, sa fokusom na usluge, galeriju i utiske." },
    { niche: "usluge", name: "Sjaj", cat: "Čišćenje i dezinfekcija", url: "https://milicadj53-bit.github.io/Sjaj.ciscenje/", img: "assets/project-sjaj.png", desc: "Radili smo dizajn i izradu sajta za servis za čišćenje, sa fokusom na usluge, cenovnik i brz kontakt telefonom." },
    { niche: "usluge", name: "Selidbe BGD", cat: "Selidbe", url: "https://milicadj53-bit.github.io/bgd.selidbe/", img: "assets/project-selidbe.png", desc: "Radili smo dizajn i izradu sajta za firmu za selidbe, sa fokusom na usluge, cenovnik i jednostavan poziv." },
  ];
  state = { niche: "sve" };

  componentDidMount() {
    this.fromHash();
    this._onHash = () => this.fromHash();
    window.addEventListener("hashchange", this._onHash);
  }
  componentWillUnmount() { window.removeEventListener("hashchange", this._onHash); }
  fromHash() {
    const h = (location.hash || "").replace("#", "");
    if (this.NICHES.some((n) => n.id === h)) this.setState({ niche: h });
  }
  refList = React.createRef();
  pick(id) {
    this.setState({ niche: id }, () => this.scrollToList());
    try { history.replaceState(null, "", id === "sve" ? location.pathname + location.search : "#" + id); } catch (e) {}
  }
  scrollToList() {
    const el = this.refList.current;
    if (!el) return;
    const offset = 76 + 72;
    const top = el.getBoundingClientRect().top;
    if (top < offset - 4 || top > window.innerHeight * 0.6) {
      window.scrollTo({ top: Math.max(0, top + window.scrollY - offset), behavior: "smooth" });
    }
  }

  renderVals() {
    const cur = this.state.niche;
    const list = this.PROJECTS.filter((p) => cur === "sve" || p.niche === cur);
    const niche = this.NICHES.find((n) => n.id === cur);
    return {
      refList: this.refList,
      nicheIntro: niche ? niche.intro : "",
      chips: this.NICHES.map((n) => {
        const on = n.id === cur;
        const count = n.id === "sve" ? this.PROJECTS.length : this.PROJECTS.filter((p) => p.niche === n.id).length;
        return {
          label: n.label, count, selected: on ? "true" : "false",
          pick: () => this.pick(n.id),
          style: "flex:none; display:inline-flex; align-items:center; gap:10px; padding:11px 18px; border-radius:999px; cursor:pointer; font-family:inherit; font-size:15px; font-weight:500; white-space:nowrap; transition:background .25s, color .25s, border-color .25s; border:1px solid " + (on ? "#211C14" : "rgba(33,28,20,0.18)") + "; background:" + (on ? "#211C14" : "transparent") + "; color:" + (on ? "#F9F4ED" : "#211C14") + ";",
          countStyle: "display:inline-flex; align-items:center; justify-content:center; min-width:24px; height:24px; padding:0 7px; border-radius:999px; font-family:'JetBrains Mono',monospace; font-size:12px; background:" + (on ? "#D6A94A" : "rgba(190,143,39,0.14)") + "; color:" + (on ? "#1B160F" : "#9a7115") + ";",
        };
      }),
      projects: list.map((p, i) => ({
        ...p,
        num: String(i + 1).padStart(2, "0"),
        alt: "Sajt: " + p.name + ", " + p.cat.toLowerCase(),
        aria: "Pogledaj sajt " + p.name,
        rowStyle: "display:flex; flex-direction:" + (i % 2 ? "row-reverse" : "row") + "; gap:clamp(28px,5vw,72px); align-items:center; padding:clamp(40px,6vw,80px) 0; border-top:" + (i === 0 ? "none" : "1px solid rgba(33,28,20,0.14)") + ";",
      })),
    };
  }
}
</script>
</body>
</html>
