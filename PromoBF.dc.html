<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<sc-if value="{{ show }}" hint-placeholder-val="{{ true }}">
  <section aria-label="Black Friday akcija" style="max-width:1240px; margin:0 auto; padding:clamp(28px,4vw,56px) clamp(20px,5vw,64px) clamp(8px,2vw,24px);">
    <div data-reveal="up" style="position:relative; overflow:hidden; display:flex; flex-direction:column; align-items:center; text-align:center; padding:clamp(32px,5vw,68px) clamp(22px,4.5vw,60px); background:#1B160F; color:#F4EEDF; border:1px solid rgba(214,169,74,0.45); border-radius:28px;">
      <div aria-hidden="true" style="position:absolute; inset:0; background:radial-gradient(70% 80% at 50% 0%,rgba(214,169,74,0.22),transparent 62%),radial-gradient(50% 60% at 50% 100%,rgba(214,169,74,0.1),transparent 60%); pointer-events:none;"></div>
      <div style="position:relative; display:inline-flex; align-items:center; gap:10px; font-family:'JetBrains Mono',monospace; font-size:12px; letter-spacing:0.2em; text-transform:uppercase; color:#1B160F; background:#D6A94A; padding:7px 16px; border-radius:999px; font-weight:500;">Black Friday · Novembar</div>
      <div style="position:relative; margin-top:26px; font-family:'JetBrains Mono',monospace; font-size:13px; letter-spacing:0.2em; text-transform:uppercase; color:#c8bfa8;">i do</div>
      <div style="position:relative; display:inline-block; padding:0 0.2em;">
        <div aria-hidden="true" data-glow="1" style="position:absolute; inset:6% 0; border-radius:50%; background:radial-gradient(closest-side,rgba(214,169,74,0.42),rgba(214,169,74,0) 100%); filter:blur(18px); pointer-events:none;"></div>
        <div style="position:relative; font-family:'Newsreader',serif; font-weight:500; font-size:clamp(96px,15vw,200px); line-height:0.95; letter-spacing:-0.04em; color:#E7BC5E; white-space:nowrap; text-shadow:0 0 42px rgba(214,169,74,0.55);">−70%</div>
      </div>
      <h2 style="position:relative; font-family:'Newsreader',serif; font-weight:400; font-size:clamp(30px,3.8vw,52px); line-height:1.08; letter-spacing:-0.02em; margin:14px auto 0; max-width:20ch; text-wrap:balance;">Cene izrade sajtova i do <span style="color:#D6A94A; font-style:italic;">70% niže</span></h2>
      <p style="position:relative; max-width:48ch; margin:16px auto 0; font-size:clamp(16px,1.5vw,19px); color:#c8bfa8; text-wrap:pretty;">Akcija traje do 30. novembra 2026. Pošaljite upit i dobićete ponudu sa Black Friday cenom.</p>
      <div class="md-btns" style="position:relative; display:flex; flex-wrap:wrap; justify-content:center; gap:14px; margin-top:28px; align-self:stretch;">
        <a data-magnetic="1" class="md-pulse" href="kontakt.html" style="display:inline-flex; align-items:center; justify-content:center; gap:10px; white-space:nowrap; padding:17px 30px; background:#D6A94A; color:#1B160F; border-radius:999px; font-weight:600; font-size:16px; transition:background .25s;" style-hover="background:#F4EEDF; color:#1B160F;">Pošalji upit <span aria-hidden="true">→</span></a>
        <a href="tel:+38162763035" style="display:inline-flex; align-items:center; justify-content:center; white-space:nowrap; padding:17px 30px; border:1px solid rgba(244,238,223,0.3); color:#F4EEDF; border-radius:999px; font-weight:500; font-size:16px; transition:border-color .25s, color .25s;" style-hover="border-color:#D6A94A; color:#D6A94A;">062 763 035</a>
      </div>
    </div>
  </section>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:&quot;420px&quot;}}">
class Component extends DCLogic {
  // Black Friday blok se sam sakriva 1. decembra 2026.
  renderVals() { return { show: Date.now() < Date.parse("2026-12-01T00:00:00+01:00") }; }
}
</script>
</body>
</html>
