<div style="background:#F9F4ED; color:#211C14; font-family:'Hanken Grotesk',system-ui,sans-serif; font-size:17px; line-height:1.6; min-height:100vh;">
  <dc-import name="SiteHeader" active="kontakt" hint-size="100%,76px" style="position:sticky; top:0; z-index:50; display:block;"></dc-import>
  <main>
    <section style="position:relative; overflow:hidden; background:#1B160F; color:#F4EEDF;">
      <div aria-hidden="true" style="position:absolute; inset:0; background:radial-gradient(80% 70% at 0% 0%,rgba(190,143,39,0.2),transparent 60%); pointer-events:none;"></div>
      <div aria-hidden="true" data-parallax="0.2" style="position:absolute; left:-3vw; bottom:-5vw; font-family:'Newsreader',serif; font-size:clamp(120px,24vw,360px); line-height:0.8; color:rgba(214,169,74,0.07); white-space:nowrap; pointer-events:none;">Kontakt</div>
      <div class="md-stack" style="position:relative; max-width:1240px; margin:0 auto; padding:clamp(48px,7vw,100px) clamp(20px,5vw,64px) clamp(48px,10vw,130px); display:grid; grid-template-columns:0.9fr 1.1fr; gap:clamp(40px,6vw,80px); align-items:start;">
        <div>
          <div data-reveal="up" style="display:inline-flex; align-items:center; gap:10px; font-family:'JetBrains Mono',monospace; font-size:12px; letter-spacing:0.2em; text-transform:uppercase; color:#D6A94A; margin-bottom:28px; padding:8px 16px; border:1px solid rgba(214,169,74,0.3); border-radius:999px;"><span style="width:6px; height:6px; background:#D6A94A; border-radius:50%; display:inline-block;"></span>Kontakt</div>
          <h1 data-stagger="70" style="font-family:'Newsreader',serif; font-weight:400; font-size:clamp(46px,6.6vw,96px); line-height:0.98; letter-spacing:-0.025em; max-width:11ch;">
            <span style="display:inline-block; overflow:hidden; vertical-align:top; padding:0 0.08em 0.1em 0; margin:0 -0.08em -0.1em 0;"><span data-reveal="word" style="display:inline-block;">Treba</span></span>
            <span style="display:inline-block; overflow:hidden; vertical-align:top; padding:0 0.08em 0.1em 0; margin:0 -0.08em -0.1em 0;"><span data-reveal="word" style="display:inline-block;">vam</span></span>
            <span style="display:inline-block; overflow:hidden; vertical-align:top; padding:0 0.08em 0.1em 0; margin:0 -0.08em -0.1em 0;"><span data-reveal="word" style="display:inline-block;">novi</span></span>
            <span style="display:inline-block; overflow:hidden; vertical-align:top; padding:0 0.12em 0.1em 0; margin:0 -0.12em -0.1em 0;"><span data-reveal="word" data-base="skewX(-8deg)" style="display:inline-block; color:#D6A94A; transform:skewX(-8deg);">sajt?</span></span>
          </h1>
          <p data-reveal="up" data-delay="320" style="margin-top:28px; max-width:42ch; font-size:clamp(18px,1.7vw,20px); color:#c8bfa8; text-wrap:pretty;">Pošaljite nam šta radite i šta trenutno imate. Ako već imate sajt, pošaljite i link.</p>
          <div data-stagger="90" style="display:flex; flex-direction:column; margin-top:40px; max-width:440px;">
            <a data-reveal="up" href="mailto:m.djakovic@mddigitalweb.com" style="display:flex; justify-content:space-between; align-items:center; gap:16px; padding:18px 0; border-top:1px solid rgba(244,238,223,0.14); color:#F4EEDF; transition:color .2s;" style-hover="color:#D6A94A;"><span style="display:flex; flex-direction:column; min-width:0;"><span style="font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:0.2em; text-transform:uppercase; color:#8a8270;">Email</span><span style="overflow-wrap:anywhere;">m.djakovic@mddigitalweb.com</span></span><span aria-hidden="true" style="color:#D6A94A;">↗</span></a>
            <a data-reveal="up" href="tel:+38162763035" style="display:flex; justify-content:space-between; align-items:center; gap:16px; padding:18px 0; border-top:1px solid rgba(244,238,223,0.14); color:#F4EEDF; transition:color .2s;" style-hover="color:#D6A94A;"><span style="display:flex; flex-direction:column;"><span style="font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:0.2em; text-transform:uppercase; color:#8a8270;">Telefon</span><span>062 763 035</span></span><span aria-hidden="true" style="color:#D6A94A;">↗</span></a>
            <a data-reveal="up" href="https://www.instagram.com/m.djakovicc/" target="_blank" rel="noopener noreferrer" style="display:flex; justify-content:space-between; align-items:center; gap:16px; padding:18px 0; border-top:1px solid rgba(244,238,223,0.14); border-bottom:1px solid rgba(244,238,223,0.14); color:#F4EEDF; transition:color .2s;" style-hover="color:#D6A94A;"><span style="display:flex; flex-direction:column;"><span style="font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:0.2em; text-transform:uppercase; color:#8a8270;">Instagram</span><span>@m.djakovicc</span></span><span aria-hidden="true" style="color:#D6A94A;">↗</span></a>
          </div>
        </div>
        <form data-reveal="up" data-delay="200" onSubmit="{{ onSubmit }}" onInput="{{ clearError }}" ref="{{ refForm }}" style="position:relative; display:flex; flex-direction:column; gap:18px; background:#F9F4ED; color:#211C14; border-radius:24px; padding:clamp(24px,3.5vw,44px); box-shadow:0 40px 90px -50px rgba(0,0,0,0.85);">
          <input type="checkbox" name="botcheck" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute; left:-9999px; opacity:0;">
          <label style="display:flex; flex-direction:column; gap:8px; font-size:14px; color:#4a4335;">Ime i prezime
            <input name="name" type="text" autocomplete="name" style="width:100%; padding:14px 16px; border:1px solid rgba(33,28,20,0.2); border-radius:10px; background:#FBF8EF; font-family:inherit; font-size:16px; color:#211C14; transition:border-color .2s, background .2s;" style-focus="background:#FFFFFF;">
            <sc-if value="{{ errors.name }}" hint-placeholder-val=""><span style="font-size:13px; color:#b4442f;">{{ errors.name }}</span></sc-if>
          </label>
          <label style="display:flex; flex-direction:column; gap:8px; font-size:14px; color:#4a4335;"><span>Naziv biznisa <span style="color:#a39b88;">(opciono)</span></span>
            <input name="business" type="text" autocomplete="organization" style="width:100%; padding:14px 16px; border:1px solid rgba(33,28,20,0.2); border-radius:10px; background:#FBF8EF; font-family:inherit; font-size:16px; color:#211C14; transition:border-color .2s, background .2s;" style-focus="background:#FFFFFF;">
          </label>
          <div class="md-stack" style="display:grid; grid-template-columns:1fr 1fr; gap:18px;">
            <label style="display:flex; flex-direction:column; gap:8px; font-size:14px; color:#4a4335;">Email
              <input name="email" type="email" autocomplete="email" style="width:100%; padding:14px 16px; border:1px solid rgba(33,28,20,0.2); border-radius:10px; background:#FBF8EF; font-family:inherit; font-size:16px; color:#211C14; transition:border-color .2s, background .2s;" style-focus="background:#FFFFFF;">
              <sc-if value="{{ errors.email }}" hint-placeholder-val=""><span style="font-size:13px; color:#b4442f;">{{ errors.email }}</span></sc-if>
            </label>
            <label style="display:flex; flex-direction:column; gap:8px; font-size:14px; color:#4a4335;"><span class="md-cap" style="white-space:nowrap;">Broj telefona <span style="color:#a39b88;">(opciono)</span></span>
              <input name="phone" type="tel" autocomplete="tel" style="width:100%; padding:14px 16px; border:1px solid rgba(33,28,20,0.2); border-radius:10px; background:#FBF8EF; font-family:inherit; font-size:16px; color:#211C14; transition:border-color .2s, background .2s;" style-focus="background:#FFFFFF;">
            </label>
          </div>
          <label style="display:flex; flex-direction:column; gap:8px; font-size:14px; color:#4a4335;"><span>Link postojećeg sajta <span style="color:#a39b88;">(opciono)</span></span>
            <input name="website" type="text" autocomplete="url" inputmode="url" style="width:100%; padding:14px 16px; border:1px solid rgba(33,28,20,0.2); border-radius:10px; background:#FBF8EF; font-family:inherit; font-size:16px; color:#211C14; transition:border-color .2s, background .2s;" style-focus="background:#FFFFFF;">
          </label>
          <label style="display:flex; flex-direction:column; gap:8px; font-size:14px; color:#4a4335;">Poruka
            <textarea name="message" rows="5" style="width:100%; padding:14px 16px; border:1px solid rgba(33,28,20,0.2); border-radius:10px; background:#FBF8EF; font-family:inherit; font-size:16px; color:#211C14; resize:vertical; transition:border-color .2s, background .2s;" style-focus="background:#FFFFFF;"></textarea>
            <sc-if value="{{ errors.message }}" hint-placeholder-val=""><span style="font-size:13px; color:#b4442f;">{{ errors.message }}</span></sc-if>
          </label>
          <button type="submit" class="md-full-m" disabled="{{ sending }}" style="{{ btnStyle }}">{{ btnLabel }}</button>
          <sc-if value="{{ errorMsg }}" hint-placeholder-val=""><span role="alert" style="font-size:14px; color:#b4442f;">{{ errorMsg }}</span></sc-if>
        </form>
      </div>
    </section>
  </main>

  <sc-if value="{{ showSuccess }}" hint-placeholder-val="">
    <div onClick="{{ closeSuccess }}" style="position:fixed; inset:0; z-index:60; display:flex; align-items:center; justify-content:center; padding:24px; background:rgba(27,22,15,0.55); backdrop-filter:blur(4px);">
      <div role="dialog" aria-modal="true" aria-label="Poruka je poslata" data-reveal="scale" style="max-width:420px; width:100%; background:#F9F4ED; border:1px solid rgba(190,143,39,0.4); border-radius:20px; padding:clamp(30px,5vw,44px); text-align:center; box-shadow:0 40px 90px -40px rgba(27,22,15,0.7);">
        <div style="display:flex; align-items:center; justify-content:center; width:68px; height:68px; margin:0 auto 20px; border-radius:50%; background:rgba(190,143,39,0.12); border:1px solid rgba(190,143,39,0.4);"><span style="font-size:32px; color:#BE8F27; line-height:1;">✓</span></div>
        <h2 style="font-family:'Newsreader',serif; font-weight:400; font-size:clamp(24px,4vw,32px); color:#211C14; margin-bottom:10px;">Poruka je poslata</h2>
        <p style="color:#4a4335; font-size:16px; text-wrap:pretty;">Hvala na upitu. Javićemo vam se u najkraćem roku.</p>
      </div>
    </div>
  </sc-if>

  <dc-import name="SiteFooter" hide-cta="{{ true }}" hint-size="100%,560px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  WEB3FORMS_ACCESS_KEY = "050d53c5-84a7-41fe-8de0-9896d4124af7";
  WEB3FORMS_ENDPOINT = "https://api.web3forms.com/submit";
  state = { sending: false, status: "", errors: {} };
  refForm = React.createRef();

  componentDidMount() { if (this.refForm.current) this.refForm.current.noValidate = true; }
  componentWillUnmount() { clearTimeout(this._t); }

  validate(v) {
    const e = {};
    if (!v.name.trim()) e.name = "Unesite ime i prezime.";
    if (!v.email.trim()) e.email = "Unesite email adresu.";
    else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.email.trim())) e.email = "Email nije u ispravnom formatu.";
    if (!v.message.trim()) e.message = "Unesite poruku.";
    else if (v.message.trim().length < 10) e.message = "Poruka mora imati najmanje 10 karaktera.";
    return e;
  }

  onSubmit = async (ev) => {
    ev.preventDefault();
    if (this.state.sending) return;
    const f = this.refForm.current;
    const g = (n) => (f.elements[n] && f.elements[n].value) || "";
    if (f.elements.botcheck && f.elements.botcheck.checked) return;
    const values = { name: g("name"), business: g("business"), email: g("email"), phone: g("phone"), website: g("website"), message: g("message") };
    const errors = this.validate(values);
    if (Object.keys(errors).length) { this.setState({ errors, status: "" }); return; }
    this.setState({ sending: true, errors: {}, status: "" });
    try {
      const res = await fetch(this.WEB3FORMS_ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "application/json", Accept: "application/json" },
        body: JSON.stringify({
          access_key: this.WEB3FORMS_ACCESS_KEY,
          subject: "Novi upit sa MD Digital sajta",
          from_name: "MD Digital sajt",
          replyto: values.email,
          ...values,
        }),
      });
      const data = await res.json();
      if (!data.success) throw new Error(data.message || "Web3Forms error");
      f.reset();
      this.setState({ sending: false, status: "success" });
      clearTimeout(this._t);
      this._t = setTimeout(() => this.setState((s) => (s.status === "success" ? { status: "" } : null)), 2000);
    } catch (err) {
      this.setState({ sending: false, status: "error" });
    }
  };

  clearError = (e) => {
    const k = e.target && e.target.name;
    if (k && this.state.errors[k]) { const errors = { ...this.state.errors }; delete errors[k]; this.setState({ errors }); }
  };

  renderVals() {
    const { sending, status, errors } = this.state;
    return {
      onSubmit: this.onSubmit, clearError: this.clearError, refForm: this.refForm,
      errors, sending,
      btnLabel: sending ? "Šaljem..." : "Pošalji poruku",
      errorMsg: status === "error" ? "Došlo je do greške. Pokušajte ponovo." : "",
      showSuccess: status === "success",
      closeSuccess: () => { clearTimeout(this._t); this.setState({ status: "" }); },
      btnStyle: {
        alignSelf: "flex-start", marginTop: "6px", padding: "16px 34px",
        background: sending ? "#4a4335" : "#211C14", color: "#F9F4ED",
        border: "none", borderRadius: "999px", fontFamily: "inherit", fontSize: "16px", fontWeight: 500,
        cursor: sending ? "default" : "pointer", opacity: sending ? 0.75 : 1, transition: "background .2s, opacity .2s",
      },
    };
  }
}
</script>
</body>
