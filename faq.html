<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Hanken+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>window.MD_PAGE={title:"Česta pitanja | MD Digital",desc:"Odgovori na najčešća pitanja o izradi sajta: rok, cena, materijali, prikaz na telefonu, domen, hosting i održavanje.",path:"/faq"};</script>
<script src="site.js"></script>
</helmet>
<div style="background:#F9F4ED; color:#211C14; font-family:'Hanken Grotesk',system-ui,sans-serif; font-size:17px; line-height:1.6; min-height:100vh;">
  <dc-import name="SiteHeader" active="faq" hint-size="100%,76px" style="position:sticky; top:0; z-index:50; display:block;"></dc-import>
  <main>
    <section class="md-stack" style="max-width:1240px; margin:0 auto; padding:clamp(40px,8vw,110px) clamp(20px,5vw,64px) clamp(52px,10vw,140px); display:grid; grid-template-columns:0.75fr 1.25fr; gap:clamp(36px,6vw,88px); align-items:start;">
      <div class="md-sticky" style="position:sticky; top:120px;">
        <div data-reveal="up" style="font-family:'JetBrains Mono',monospace; font-size:12.5px; letter-spacing:0.22em; text-transform:uppercase; color:#BE8F27; margin-bottom:22px;">FAQ</div>
        <h1 data-stagger="80" style="font-family:'Newsreader',serif; font-weight:400; font-size:clamp(46px,6.4vw,92px); line-height:0.98; letter-spacing:-0.025em;">
          <span style="display:inline-block; overflow:hidden; vertical-align:top; padding:0 0.08em 0.1em 0; margin:0 -0.08em -0.1em 0;"><span data-reveal="word" style="display:inline-block;">Česta</span></span>
          <span style="display:inline-block; overflow:hidden; vertical-align:top; padding:0 0.12em 0.1em 0; margin:0 -0.12em -0.1em 0;"><span data-reveal="word" data-base="skewX(-8deg)" style="display:inline-block; color:#BE8F27; transform:skewX(-8deg);">pitanja</span></span>
        </h1>
        <p data-reveal="up" data-delay="260" style="margin-top:24px; max-width:32ch; color:#4a4335; text-wrap:pretty;">Niste našli odgovor? Pišite nam i odgovorićemo vam direktno.</p>
        <div class="md-btns" data-reveal="up" data-delay="340" style="display:flex; margin-top:28px;">
          <a data-magnetic="1" href="kontakt.html" style="display:inline-flex; align-items:center; gap:10px; padding:15px 26px; background:#211C14; color:#F9F4ED; border-radius:999px; font-weight:500; transition:background .25s;" style-hover="background:#BE8F27; color:#1B160F;">Postavite pitanje <span aria-hidden="true">→</span></a>
        </div>
      </div>
      <div data-stagger="70" style="border-bottom:1px solid rgba(33,28,20,0.14);">
        <sc-for list="{{ faqs }}" as="f" hint-placeholder-count="6">
          <div data-reveal="up" style="border-top:1px solid rgba(33,28,20,0.14);">
            <h2 style="font-weight:400;">
              <button type="button" onClick="{{ f.toggle }}" aria-expanded="{{ f.expanded }}" style="width:100%; display:flex; align-items:center; justify-content:space-between; gap:24px; padding:26px 0; background:none; border:none; cursor:pointer; text-align:left; font-family:'Newsreader',serif; font-size:clamp(21px,2.3vw,29px); line-height:1.25; color:#211C14; transition:color .2s;" style-hover="color:#BE8F27;">
                <span style="flex:1; min-width:0;">{{ f.q }}</span>
                <span aria-hidden="true" style="{{ f.iconStyle }}">+</span>
              </button>
            </h2>
            <div style="{{ f.panelStyle }}">
              <div style="overflow:hidden; min-height:0;">
                <p style="padding:0 64px 28px 0; max-width:64ch; color:#4a4335; font-size:17px; text-wrap:pretty;">{{ f.a }}</p>
              </div>
            </div>
          </div>
        </sc-for>
      </div>
    </section>
  </main>
  <dc-import name="SiteFooter" hint-size="100%,820px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { open: 0 };
  data = [
    ["Koliko traje izrada sajta?", "Zavisi od obima projekta. Rok dogovaramo pre početka, zajedno sa obimom posla i materijalima koji su potrebni."],
    ["Koliko košta sajt?", "Cena zavisi od broja stranica i funkcija koje su vam potrebne. Kada nam pošaljete osnovne informacije, pre početka rada dobijate predlog sa obimom posla i cenom."],
    ["Šta je potrebno od mene da bismo počeli?", "Treba nam naziv biznisa, usluge, postojeći sajt ako ga imate i ideja kako biste želeli da izgleda sajt."],
    ["Da li će sajt dobro izgledati na telefonu?", "Da. Svaki sajt radimo i za desktop i za mobilni, a pre objave posebno proveravamo prikaz na telefonu."],
    ["Mogu li da vidim sajt pre objave?", "Da. Dobijate link na kojem možete da pregledate prvu verziju, a zatim šaljete komentare i mi ispravljamo dogovorene stvari."],
    ["Da li pomažete oko domena i hostinga?", "Da. Pre objave povezujemo domen i hosting i proveravamo da li sve radi."],
    ["Šta ako kasnije želim izmene na sajtu?", "Ako želite da nastavimo saradnju posle objave, možemo da menjamo tekstove, fotografije, sekcije i druge delove sajta."],
    ["Da li radite SEO?", "Pre objave radimo osnovnu SEO optimizaciju: naslove stranica, opise i tehnička podešavanja koja pomažu da Google lakše pronađe vaš sajt."],
    ["Sa kim komuniciram tokom projekta?", "Direktno sa mnom, od prvog razgovora do objave sajta. Bez account menadžera i dugih lanaca komunikacije."],
  ];
  renderVals() {
    const o = this.state.open;
    return {
      faqs: this.data.map(([q, a], i) => {
        const on = o === i;
        return {
          q, a, expanded: on ? "true" : "false",
          toggle: () => this.setState({ open: on ? -1 : i }),
          iconStyle: "flex:none; width:46px; height:46px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:'Hanken Grotesk',sans-serif; font-size:26px; line-height:1; transition:transform .45s cubic-bezier(.2,.7,.2,1), background .3s, color .3s, border-color .3s; border:1px solid " + (on ? "#BE8F27" : "rgba(33,28,20,0.2)") + "; background:" + (on ? "#BE8F27" : "transparent") + "; color:" + (on ? "#F9F4ED" : "#BE8F27") + "; transform:rotate(" + (on ? 135 : 0) + "deg);",
          panelStyle: "display:grid; grid-template-rows:" + (on ? "1fr" : "0fr") + "; transition:grid-template-rows .5s cubic-bezier(.2,.7,.2,1);",
        };
      }),
    };
  }
}
</script>
